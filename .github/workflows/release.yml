name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            formats: nsis
          - name: linux-x64
            os: ubuntu-22.04
            formats: deb,appimage
          - name: macos-arm64
            os: macos-15
            formats: dmg
          - name: macos-x64
            os: macos-15-intel
            formats: dmg
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfuse2 libfontconfig1-dev libwayland-dev \
            libx11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcursor-dev libxi-dev libxkbcommon-dev libxrandr-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Prepare macOS runner
        if: runner.os == 'macOS'
        run: |
          # Spotlight can keep the mounted DMG busy while create-dmg unmounts it.
          sudo mdutil -a -i off || true
          hdiutil detach "/Volumes/Photo Resizer" -force || true

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Build installers (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          # Re-sign the binary ad-hoc after the build. The packager's build
          # command is a no-op here, so the signed binary is what gets copied
          # into the app bundle.
          cargo build --release --locked
          codesign --force --sign - target/release/photo-resizer
          for attempt in 1 2 3; do
            echo "Packaging attempt $attempt..."
            if cargo packager --release --formats "${{ matrix.formats }}" --out-dir dist; then
              exit 0
            fi
            echo "Packaging failed; cleaning up the mounted image and retrying..."
            hdiutil detach "/Volumes/Photo Resizer" -force || true
            rm -rf dist
            sleep 5
          done
          echo "Packaging failed after 3 attempts." >&2
          exit 1

      - name: Build installers
        if: runner.os != 'macOS'
        env:
          # linuxdeploy is itself an AppImage; run it without FUSE on runners.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: cargo packager --release --formats ${{ matrix.formats }} --out-dir dist

      - name: Verify macOS executable signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # A stripped binary can keep a stale ad-hoc signature, which macOS
          # reports as a damaged app. Fail the release if that ever happens.
          DMG=$(ls dist/*.dmg | head -n 1)
          MOUNT=/tmp/photo-resizer-dmg
          mkdir -p "$MOUNT"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT"
          trap 'hdiutil detach "$MOUNT" -force || true' EXIT
          APP=$(find "$MOUNT" -maxdepth 1 -name "*.app" | head -n 1)
          EXEC=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Contents/Info.plist")
          codesign --verify --strict --verbose=2 "$APP/Contents/MacOS/$EXEC"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error

  release:
    name: Publish release
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.deb
            dist/*.AppImage
          generate_release_notes: true
