name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            formats: nsis
          - name: linux-x64
            os: ubuntu-22.04
            formats: deb,appimage
          - name: macos-arm64
            os: macos-15
            formats: dmg
            dmg_arch: aarch64
          - name: macos-x64
            os: macos-15-intel
            formats: dmg
            dmg_arch: x64
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfuse2 libfontconfig1-dev libwayland-dev \
            libx11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcursor-dev libxi-dev libxkbcommon-dev libxrandr-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Prepare macOS runner
        if: runner.os == 'macOS'
        run: |
          # Spotlight can keep the mounted DMG busy while create-dmg unmounts it.
          sudo mdutil -a -i off || true
          hdiutil detach "/Volumes/Photo Resizer" -force || true

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Build macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: cargo packager --release --formats app --out-dir dist

      - name: Sign and verify macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Ad-hoc sign the complete app bundle. Signing the bundle (rather than
          # just the executable) keeps macOS from reporting the app as damaged.
          xattr -cr "dist/Photo Resizer.app"
          codesign --force --deep --sign - "dist/Photo Resizer.app"
          codesign --verify --deep --strict --verbose=2 "dist/Photo Resizer.app"

      - name: Create macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          STAGE=dist/dmg-stage
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R "dist/Photo Resizer.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Photo Resizer" -srcfolder "$STAGE" -ov -format UDZO \
            "dist/Photo.Resizer_${VERSION}_${{ matrix.dmg_arch }}.dmg"
          rm -rf "$STAGE"

      - name: Build installers
        if: runner.os != 'macOS'
        env:
          # linuxdeploy is itself an AppImage; run it without FUSE on runners.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: cargo packager --release --formats ${{ matrix.formats }} --out-dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error

  release:
    name: Publish release
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.deb
            dist/*.AppImage
          generate_release_notes: true
