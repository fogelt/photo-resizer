[package]
name = "photo-resizer"
version = "0.1.5"
edition = "2021"
rust-version = "1.88"
description = "A fast, lightweight batch image resizer for the web"
license = "MIT"

[dependencies]
display-info = "0.5"
iced = { version = "0.14", default-features = false, features = [
    "crisp",
    "image-without-codecs",
    "thread-pool",
    "tiny-skia",
    "wayland",
    "web-colors",
    "x11",
] }
iced_font_awesome = "0.4"
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "dds",
    "ff",
    "gif",
    "hdr",
    "ico",
    "jpeg",
    "png",
    "pnm",
    "qoi",
    "tga",
    "tiff",
    "webp",
] }
rayon = "1.11"
rfd = { version = "0.18", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
# Do not strip the binary: on macOS, stripping after linking can invalidate the
# ad-hoc code signature, which makes macOS report the app as damaged.

[package.metadata.packager]
product_name = "Photo Resizer"
identifier = "com.fogelt.photoresizer"
version = "0.1.5"
description = "Batch resize photos to web-friendly dimensions."
authors = ["fogelt"]
publisher = "fogelt"
homepage = "https://github.com/fogelt/photo-resizer"
category = "Photography"
copyright = "2026, fogelt"

before_packaging_command = "cargo build --release --locked"

icons = ["assets/icons/icon.ico", "assets/icons/icon-512.png"]
formats = ["nsis", "dmg", "deb", "appimage"]

[package.metadata.packager.macos]
minimum_system_version = "11.0"

[package.metadata.packager.deb]
priority = "optional"
section = "graphics"
depends = ["libc6", "libfontconfig1", "libwayland-client0", "libxkbcommon0"]

