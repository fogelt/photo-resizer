[package]
name = "photo-resizer"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A fast, lightweight batch image resizer for the web"
license = "MIT"

[dependencies]
display-info = "0.5"
iced = { version = "0.14", default-features = false, features = [
    "crisp",
    "thread-pool",
    "tiny-skia",
    "wayland",
    "web-colors",
    "x11",
] }
iced_font_awesome = "0.4"
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "dds",
    "ff",
    "gif",
    "hdr",
    "ico",
    "jpeg",
    "png",
    "pnm",
    "qoi",
    "tga",
    "tiff",
    "webp",
] }
rayon = "1.11"
rfd = { version = "0.18", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
